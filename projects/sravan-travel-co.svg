<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a"/>
  
  <!-- App Header / Navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#1e293b" border-bottom="1px solid rgba(255,255,255,0.1)"/>
  <circle cx="50" cy="32" r="16" fill="#0284c7"/>
  <rect x="80" y="24" width="140" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="800" y="26" width="70" height="12" rx="3" fill="#94a3b8"/>
  <rect x="890" y="26" width="70" height="12" rx="3" fill="#94a3b8"/>
  <rect x="980" y="26" width="70" height="12" rx="3" fill="#94a3b8"/>
  <rect x="1080" y="18" width="140" height="28" rx="6" fill="#0284c7"/>
  
  <!-- Hero Section -->
  <rect x="40" y="88" width="1200" height="240" rx="16" fill="url(#hero-grad)"/>
  <defs>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1280" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect x="80" y="128" width="400" height="28" rx="6" fill="#ffffff"/>
  <rect x="80" y="170" width="320" height="16" rx="4" fill="#93c5fd" opacity="0.8"/>
  
  <!-- Search / Filter Bar -->
  <rect x="80" y="210" width="1040" height="60" rx="12" fill="#ffffff" opacity="0.95"/>
  <rect x="100" y="226" width="220" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="340" y="226" width="220" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="580" y="226" width="220" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="960" y="222" width="140" height="36" rx="8" fill="#0284c7"/>
  
  <!-- Content Section Heading -->
  <rect x="40" y="356" width="240" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="40" y="386" width="360" height="14" rx="3" fill="#64748b"/>
  
  <!-- Travel Destination Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(40, 420)">
    <rect width="375" height="260" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="12" y="12" width="351" height="140" rx="10" fill="#0284c7" opacity="0.6"/>
    <rect x="20" y="164" width="180" height="16" rx="4" fill="#ffffff"/>
    <rect x="20" y="188" width="120" height="12" rx="3" fill="#38bdf8"/>
    <rect x="20" y="218" width="80" height="20" rx="4" fill="#0369a1"/>
    <rect x="275" y="218" width="80" height="26" rx="6" fill="#0284c7"/>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(452, 420)">
    <rect width="375" height="260" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="12" y="12" width="351" height="140" rx="10" fill="#0d9488" opacity="0.6"/>
    <rect x="20" y="164" width="180" height="16" rx="4" fill="#ffffff"/>
    <rect x="20" y="188" width="120" height="12" rx="3" fill="#2dd4bf"/>
    <rect x="20" y="218" width="80" height="20" rx="4" fill="#0f766e"/>
    <rect x="275" y="218" width="80" height="26" rx="6" fill="#0d9488"/>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(864, 420)">
    <rect width="375" height="260" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="12" y="12" width="351" height="140" rx="10" fill="#6366f1" opacity="0.6"/>
    <rect x="20" y="164" width="180" height="16" rx="4" fill="#ffffff"/>
    <rect x="20" y="188" width="120" height="12" rx="3" fill="#818cf8"/>
    <rect x="20" y="218" width="80" height="20" rx="4" fill="#4338ca"/>
    <rect x="275" y="218" width="80" height="26" rx="6" fill="#6366f1"/>
  </g>
</svg>
