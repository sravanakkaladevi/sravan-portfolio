<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Background -->
  <rect width="1280" height="720" fill="#111827"/>
  
  <!-- Django Header -->
  <rect x="0" y="0" width="1280" height="64" fill="#1f2937" border-bottom="1px solid rgba(255,255,255,0.08)"/>
  <rect x="40" y="22" width="240" height="20" rx="4" fill="#ffffff"/>
  <rect x="300" y="24" width="100" height="16" rx="4" fill="#059669"/>
  <rect x="1080" y="18" width="140" height="28" rx="6" fill="#854ce6"/>
  
  <!-- Main Grid: Left 60% Geographic Folium Risk Map, Right 40% K-Means Clustering Analytics -->
  <!-- Left Side: Interactive Folium Risk Map Card -->
  <g transform="translate(40, 88)">
    <rect width="720" height="592" rx="14" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="20" width="220" height="18" rx="4" fill="#ffffff"/>
    <rect x="24" y="44" width="160" height="12" rx="3" fill="#9ca3af"/>
    
    <!-- Folium Map Graphic Container -->
    <rect x="24" y="74" width="672" height="494" rx="10" fill="#111827"/>
    
    <!-- Map Roads / Grid Lines -->
    <path d="M40 200 Q 200 160 400 240 T 672 200" stroke="#374151" stroke-width="4" fill="none"/>
    <path d="M120 74 L180 568 M340 74 L300 568 M520 74 L560 568" stroke="#374151" stroke-width="3" fill="none"/>
    
    <!-- Risk Zone Clusters -->
    <!-- High Risk Cluster (Red) -->
    <circle cx="200" cy="220" r="45" fill="#ef4444" opacity="0.4"/>
    <circle cx="200" cy="220" r="16" fill="#ef4444"/>
    <circle cx="250" cy="260" r="35" fill="#ef4444" opacity="0.3"/>
    <circle cx="250" cy="260" r="12" fill="#ef4444"/>
    
    <!-- Moderate Risk Cluster (Amber) -->
    <circle cx="450" cy="340" r="55" fill="#f59e0b" opacity="0.4"/>
    <circle cx="450" cy="340" r="18" fill="#f59e0b"/>
    <circle cx="500" cy="300" r="40" fill="#f59e0b" opacity="0.3"/>
    
    <!-- Safe Zone Cluster (Green) -->
    <circle cx="320" cy="440" r="50" fill="#10b981" opacity="0.4"/>
    <circle cx="320" cy="440" r="16" fill="#10b981"/>
    <circle cx="160" cy="420" r="40" fill="#10b981" opacity="0.3"/>
  </g>
  
  <!-- Right Side: K-Means Cluster Metrics & Analysis -->
  <g transform="translate(780, 88)">
    <rect width="460" height="592" rx="14" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="20" width="220" height="18" rx="4" fill="#ffffff"/>
    <rect x="24" y="44" width="160" height="12" rx="3" fill="#9ca3af"/>
    
    <!-- K-Means Cluster Breakdown -->
    <rect x="24" y="80" width="412" height="80" rx="10" fill="#111827"/>
    <rect x="40" y="100" width="140" height="14" rx="3" fill="#ef4444"/>
    <rect x="40" y="124" width="180" height="12" rx="3" fill="#9ca3af"/>
    <rect x="340" y="100" width="72" height="40" rx="6" fill="#ef4444" opacity="0.2"/>
    
    <rect x="24" y="176" width="412" height="80" rx="10" fill="#111827"/>
    <rect x="40" y="196" width="140" height="14" rx="3" fill="#f59e0b"/>
    <rect x="40" y="220" width="180" height="12" rx="3" fill="#9ca3af"/>
    <rect x="340" y="196" width="72" height="40" rx="6" fill="#f59e0b" opacity="0.2"/>
    
    <rect x="24" y="272" width="412" height="80" rx="10" fill="#111827"/>
    <rect x="40" y="292" width="140" height="14" rx="3" fill="#10b981"/>
    <rect x="40" y="316" width="180" height="12" rx="3" fill="#9ca3af"/>
    <rect x="340" y="292" width="72" height="40" rx="6" fill="#10b981" opacity="0.2"/>
    
    <!-- Prediction Trend Graph -->
    <rect x="24" y="368" width="412" height="198" rx="10" fill="#111827"/>
    <path d="M40 520 Q 140 440 240 480 T 410 400" stroke="#854ce6" stroke-width="4" fill="none"/>
  </g>
</svg>
