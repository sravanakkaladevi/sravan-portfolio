<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945" fill="none">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="945" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a22"/>
      <stop offset="1" stop-color="#11120f"/>
    </linearGradient>
    <filter id="noise" x="0" y="0" width="1680" height="945">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1680" height="945" fill="url(#wood)"/>

  <!-- wood planks -->
  <g opacity="0.55">
    <rect x="0" y="0" width="180" height="945" fill="#1a1a14"/>
    <rect x="190" y="0" width="180" height="945" fill="#23231c"/>
    <rect x="380" y="0" width="180" height="945" fill="#1a1a14"/>
    <rect x="570" y="0" width="180" height="945" fill="#26261e"/>
    <rect x="760" y="0" width="180" height="945" fill="#1b1b15"/>
    <rect x="950" y="0" width="180" height="945" fill="#27271f"/>
    <rect x="1140" y="0" width="180" height="945" fill="#1b1b16"/>
    <rect x="1330" y="0" width="180" height="945" fill="#25251d"/>
    <rect x="1520" y="0" width="160" height="945" fill="#171711"/>
  </g>

  <!-- blood handprint -->
  <g opacity="0.7" fill="#6b0f12">
    <ellipse cx="875" cy="430" rx="180" ry="130"/>
    <rect x="830" y="140" width="46" height="210" rx="23" transform="rotate(-6 830 140)"/>
    <rect x="885" y="115" width="42" height="230" rx="21" transform="rotate(8 885 115)"/>
    <rect x="940" y="145" width="38" height="200" rx="19" transform="rotate(20 940 145)"/>
    <rect x="785" y="180" width="36" height="180" rx="18" transform="rotate(-20 785 180)"/>
    <rect x="740" y="235" width="32" height="150" rx="16" transform="rotate(-30 740 235)"/>
    <circle cx="1120" cy="430" r="24"/>
    <circle cx="1080" cy="520" r="18"/>
    <circle cx="980" cy="580" r="14"/>
    <circle cx="730" cy="540" r="16"/>
  </g>

  <!-- crime tape bands -->
  <g>
    <g transform="rotate(-6 840 250)">
      <rect x="-120" y="220" width="1920" height="95" fill="#efe600"/>
      <text x="-80" y="287" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#111">CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS</text>
    </g>

    <g transform="rotate(14 840 500)">
      <rect x="-120" y="460" width="1920" height="105" fill="#f0e400"/>
      <text x="-70" y="536" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#111">CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS</text>
    </g>

    <g transform="rotate(-10 840 710)">
      <rect x="-120" y="670" width="1920" height="95" fill="#efe600"/>
      <text x="-70" y="736" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#111">CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS - CRIME SCENE DO NOT CROSS</text>
    </g>
  </g>

  <rect width="1680" height="945" filter="url(#noise)"/>
</svg>
