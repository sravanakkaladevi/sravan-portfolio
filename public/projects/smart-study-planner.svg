<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="planner-bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#planner-bg)"/>
  <g transform="translate(120, 140)" fill="none" stroke="#818cf8" stroke-width="4">
    <rect x="0" y="0" width="140" height="160" rx="16" fill="rgba(129, 140, 248, 0.1)"/>
    <line x1="30" y1="40" x2="110" y2="40" stroke-linecap="round"/>
    <line x1="30" y1="70" x2="110" y2="70" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="80" y2="100" stroke-linecap="round"/>
  </g>
  <g opacity="0.85">
    <rect x="340" y="140" width="740" height="60" rx="12" fill="#312e81"/>
    <rect x="340" y="220" width="600" height="40" rx="10" fill="#1e293b"/>
    <rect x="340" y="280" width="660" height="40" rx="10" fill="#1e293b"/>
  </g>
  <text x="120" y="480" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="white">Smart Study Planner</text>
  <text x="120" y="540" font-family="Arial, sans-serif" font-size="30" fill="#a5b4fc">HTML, CSS, JavaScript, Bootstrap</text>
</svg>
