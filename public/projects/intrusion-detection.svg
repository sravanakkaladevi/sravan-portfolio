<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <!-- Background -->
  <rect width="1280" height="720" fill="#0b1120"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1280" height="64" fill="#1e293b" border-bottom="1px solid rgba(255,255,255,0.08)"/>
  <rect x="40" y="22" width="220" height="20" rx="4" fill="#ffffff"/>
  <rect x="280" y="24" width="140" height="16" rx="4" fill="#ef4444"/>
  
  <!-- Left Sidebar (Streamlit Controls) -->
  <g transform="translate(40, 88)">
    <rect width="280" height="592" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="20" y="24" width="160" height="16" rx="4" fill="#ffffff"/>
    <rect x="20" y="56" width="240" height="36" rx="6" fill="#334155"/>
    <rect x="20" y="112" width="140" height="14" rx="3" fill="#94a3b8"/>
    <rect x="20" y="136" width="240" height="10" rx="2" fill="#ef4444"/>
    <rect x="20" y="176" width="140" height="14" rx="3" fill="#94a3b8"/>
    <rect x="20" y="200" width="240" height="36" rx="6" fill="#334155"/>
    <rect x="20" y="260" width="240" height="40" rx="8" fill="#ef4444"/>
  </g>
  
  <!-- Main Dashboard Area -->
  <!-- Stat Metrics Row -->
  <g transform="translate(340, 88)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="280" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="20" y="20" width="120" height="12" rx="3" fill="#94a3b8"/>
    <rect x="20" y="44" width="160" height="28" rx="4" fill="#ffffff"/>
    <rect x="20" y="78" width="80" height="12" rx="3" fill="#4ade80"/>
    
    <!-- Stat 2 -->
    <rect x="306" y="0" width="280" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="326" y="20" width="120" height="12" rx="3" fill="#94a3b8"/>
    <rect x="326" y="44" width="160" height="28" rx="4" fill="#ef4444"/>
    <rect x="326" y="78" width="80" height="12" rx="3" fill="#f87171"/>
    
    <!-- Stat 3 -->
    <rect x="613" y="0" width="287" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="633" y="20" width="120" height="12" rx="3" fill="#94a3b8"/>
    <rect x="633" y="44" width="160" height="28" rx="4" fill="#ffffff"/>
    <rect x="633" y="78" width="80" height="12" rx="3" fill="#38bdf8"/>
  </g>
  
  <!-- Charts Area -->
  <!-- Chart 1: ML Confusion Matrix / Distribution -->
  <g transform="translate(340, 218)">
    <rect width="435" height="462" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="20" width="180" height="16" rx="4" fill="#ffffff"/>
    
    <!-- Bar Chart Elements -->
    <rect x="40" y="70" width="50" height="320" rx="4" fill="#334155"/>
    <rect x="40" y="110" width="50" height="280" rx="4" fill="#38bdf8"/>
    
    <rect x="120" y="70" width="50" height="320" rx="4" fill="#334155"/>
    <rect x="120" y="320" width="50" height="70" rx="4" fill="#ef4444"/>
    
    <rect x="200" y="70" width="50" height="320" rx="4" fill="#334155"/>
    <rect x="200" y="250" width="50" height="140" rx="4" fill="#facc15"/>
    
    <rect x="280" y="70" width="50" height="320" rx="4" fill="#334155"/>
    <rect x="280" y="280" width="50" height="110" rx="4" fill="#4ade80"/>
  </g>
  
  <!-- Chart 2: Threat Detection Timeline -->
  <g transform="translate(795, 218)">
    <rect width="445" height="462" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="20" width="180" height="16" rx="4" fill="#ffffff"/>
    
    <!-- Timeline Graph Polyline -->
    <path d="M40 380 L100 360 L160 370 L220 180 L280 340 L340 360 L400 350" stroke="#ef4444" stroke-width="4" fill="none"/>
    <path d="M40 380 L100 360 L160 370 L220 180 L280 340 L340 360 L400 350 L400 400 L40 400 Z" fill="rgba(239,68,68,0.15)"/>
  </g>
</svg>
